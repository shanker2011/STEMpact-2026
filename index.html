<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="https://shanker2011.github.io/STEMpact-2026/Images/logo.png">
        <meta charset="UTF-8">
        <title>STEMPACT</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
        <style>
        /* Everything in the style tag is done with css(controls how things look, html is the structure)*/
           * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
           }

           body {
              font-family: 'montserrat', sans-serif;
           }


           .background-page {
              background-image: url('https://shanker2011.github.io/STEMpact-2026/Images/bg2.avif');
              background-size: cover; /*makes the background image cover the entire page*/
              background-position: center; /*centers the background image*/
              min-height: 100vh; /*makes the background image take up the full height of the viewport*/
              position: relative;
           }
              .hero-container {
                    top:50%;
                    left:50%; 
                    align-items: center; 
                    transform: translate(-50%, -50%);
                    text-align: center;   
                    margin-top: -50px;    
                    position: absolute;    
              }

              .hero-container h1 {
                    font-family: 'Montserrat', sans-serif;
                    font-weight: 400;         
                    font-size: 120px; 
                    color: #fff9f9;           
                    margin-bottom: 20px;        
              }
                .hero-container p {
                        font-family: 'Montserrat', sans-serif;
                        font-size: 15px; 
                        color: #fff9f9; 
                        margin-bottom: 30px;
                }

                .hero-buttons {
                    top: 70%;
                    left: 50%;
                    transform: translate(-1%, 100%);
                    display: flex; 
                    gap: 20px; 
                    height: auto;
                    margin-top: -50px;  
                    justify-content: center;
                }
                .btn {
                   font-family: 'Montserrat', sans-serif;
                   font-size: 16px;         
                   font-weight: 700;
                   text-decoration: none;
                   padding: 16px 40px;       
                   border-radius: 6px;     
                   transition: all 0.3s ease;
                 }

                .primary-btn {
                   background-color: #6e83eb;
                   color: #efe9e9;
                }

                .primary-btn:hover {
                   background-color: #f5f6f9; 
                   color: #000;
                }

                .secondary-btn {
                 background-color: transparent;
                 color: #6e83eb;
                 border: 2px solid #fff9f9;
                } 

                  .secondary-btn:hover {
                 background-color: #fff9f9;
                 color: #000;
                 }

                 .logo-link {
                    display: flex;
                    align-items: center;
                    text-decoration: none; 
                 }     
            
         </style>
        </head>  
        <body class = "background-page">
        <div id="navbar-placeholder"></div>
        <div class="hero-container">
            <h1><span style="font-weight: 700;">STEM</span>PACT</h1>
            <p>NON-PROFIT BIO-RESEARCH · INNOVATION · SUSTAINABLE DEVELOPMENT</p>
        
        <div class="hero-buttons">
        <a href="vision.html" class="btn primary-btn">EXPLORE <i class="fas fa-arrow-right"></i></a>
        <a href="https://instagram.com/5t3mclub" class="btn secondary-btn"><i class="fab fa-instagram"></i> INSTAGRAM</a>
    </div>
    </div>
       <div id="footer-placeholder"></div>

       <script src="nav.js"></script>
       <script src="footer.js"></script>
        
    </body>
    </html>
