<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="https://shanker2011.github.io/STEMpact-2026/Images/logo.png">
        <meta charset="UTF-8">
        <title>STEMPACT</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <style>
        /* Everything in the style tag is done with css(controls how things look, html is the structure)*/
           * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
           }

           body {
              font-family: 'montserrat', sans-serif;
           }

           nav {
             position:absolute;
             top: 0;
             right: 0;
             width: 100%; /*play around with this value to adjust the width to your liking*/
             display: flex;  /*aligns everything in nav area in a row*/
             align-items: center; /*vertically centers the items in the nav area*/
             justify-content: space-between; /*adds space between the items in the nav area*/
             padding: 20px 40px; 
             z-index: 10; /*ensures the nav bar stays on the top of other content*/
           }
              .nav-links a {
                  color: #fff9f9; 
                  text-decoration: none; 
                  margin-left: 20px; 
                  font-size: 13px; 
                  transition: color 0.3s ease; 
              }

              .nav-links a:hover {
                  color: #6e83eb; 
              }
           .logo {
              display: flex;
              align-items: center;
           }

           .logo img {
              height: 30px; 
              width: auto;
              display: block; 
           }

           .logo span {
              font-family: 'Montserrat', sans-serif;
              font-weight: 400;         
              font-size: 20px; 
              color: #fff9f9;           
              margin-left: 15px;        
              line-height: 1;          
           }

           .background-page {
              background-image: url('https://shanker2011.github.io/STEMpact-2026/Images/bg2.avif');
              background-size: cover; /*makes the background image cover the entire page*/
              background-position: center; /*centers the background image*/
              height: 100vh; /*makes the background image take up the full height of the viewport*/
           }
              .hero-container {
                    position:absolute;
                    top:50%;
                    left:50%; 
                    align-items: center; 
                    transform: translate(-50%, -50%);
                    text-align: center;   
                    margin-top: -50px;        
              }

              .hero-container h1 {
                    font-family: 'Montserrat', sans-serif;
                    font-weight: 400;         
                    font-size: 120px; 
                    color: #fff9f9;           
                    margin-bottom: 20px;        
              }
                .hero-container p {
                        font-family: 'Montserrat', sans-serif;
                        font-size: 15px; 
                        color: #fff9f9; 
                }

                .hero-buttons {
                    position: absolute;
                    top: 70%;
                    left: 50%;
                    transform: translate(-50%, -50%); 
                    display: flex; 
                    gap: 20px; 
                    height: auto;
                    margin-top: -50px;  
                }
                .btn {
                   font-family: 'Montserrat', sans-serif;
                   font-size: 16px;         
                   font-weight: 700;
                   text-decoration: none;
                   padding: 16px 40px;       
                   border-radius: 6px;     
                   transition: all 0.3s ease;
                 }

                .primary-btn {
                   background-color: #6e83eb;
                   color: #000;
                }

                .primary-btn:hover {
                   background-color: #f5f6f9; 
                   color: #000;
                }

                .secondary-btn {
                 background-color: transparent;
                 color: #6e83eb;
                 border: 2px solid #fff9f9;
                } 

                  .secondary-btn:hover {
                 background-color: #fff9f9;
                 color: #000;
                 }

                 .logo-link {
                    display: flex;
                    align-items: center;
                    text-decoration: none; 
                 }

                 .footer{
                     position: absolute;
                     bottom: 0;
                     width: 100%;
                     text-align: center;
                     padding: 20px; 
                     background-color: rgba(0, 0, 0, 0.5); 
                     color: #fff9f9;
                 }

                 @view-transition {
                     navigation: auto;
                 }
            
         </style>
         <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="https://shanker2011.github.io/STEMpact-2026/Images/logo.png" alt="STEMpact Logo">
                    <span>STEMPACT</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="vision.html">OUR VISION</a>
                <a href="research.html">RESEARCH</a>
                <a href="contact.html">CONTACT</a>
                <a href="pictures.html">PICTURES</a>
            </div>
        </nav>
    </head>
    <body class = "background-page">
        <div class="hero-container">
            <h1><span style="font-weight: 700;">STEM</span>PACT</h1>
            <p>NON-PROFIT BIO-RESEARCH · INNOVATION · SUSTAINABLE DEVELOPMENT</p>
        </div>
        
        <div class="hero-buttons">
        <a href="vision.html" class="btn primary-btn">EXPLORE</a>
        <a href="https://instagram.com/5t3mclub" target="_blank" class="btn secondary-btn">INSTAGRAM</a>
    </div>
        <footer class="footer">
            &copy; 2026 STEMPACT (ADD MORE INFO LATER)
        </footer>
    </body>
    </html>
