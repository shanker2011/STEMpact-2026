<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="https://shanker2011.github.io/STEMpact-2026/Images/logo.png">
        <meta charset="UTF-8">
        <title>STEMPACT</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <style>
        /* Everything in the style tag is done with css(controls how things look, html is the structure)*/
           * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
           }

           body {
              font-family: 'montserrat', sans-serif;
           }


           .background-page {
              background-image: url('https://shanker2011.github.io/STEMpact-2026/Images/bg2.avif');
              background-size: cover; /*makes the background image cover the entire page*/
              background-position: center; /*centers the background image*/
              height: 100vh; /*makes the background image take up the full height of the viewport*/
           }
              .hero-container {
                    position:absolute;
                    top:50%;
                    left:50%; 
                    align-items: center; 
                    transform: translate(-50%, -50%);
                    text-align: center;   
                    margin-top: -50px;        
              }

              .hero-container h1 {
                    font-family: 'Montserrat', sans-serif;
                    font-weight: 400;         
                    font-size: 120px; 
                    color: #fff9f9;           
                    margin-bottom: 20px;        
              }
                .hero-container p {
                        font-family: 'Montserrat', sans-serif;
                        font-size: 15px; 
                        color: #fff9f9; 
                }

                .hero-buttons {
                    position: absolute;
                    top: 70%;
                    left: 50%;
                    transform: translate(-50%, -50%); 
                    display: flex; 
                    gap: 20px; 
                    height: auto;
                    margin-top: -50px;  
                }
                .btn {
                   font-family: 'Montserrat', sans-serif;
                   font-size: 16px;         
                   font-weight: 700;
                   text-decoration: none;
                   padding: 16px 40px;       
                   border-radius: 6px;     
                   transition: all 0.3s ease;
                 }

                .primary-btn {
                   background-color: #6e83eb;
                   color: #efe9e9;
                }

                .primary-btn:hover {
                   background-color: #f5f6f9; 
                   color: #000;
                }

                .secondary-btn {
                 background-color: transparent;
                 color: #6e83eb;
                 border: 2px solid #fff9f9;
                } 

                  .secondary-btn:hover {
                 background-color: #fff9f9;
                 color: #000;
                 }

                 .logo-link {
                    display: flex;
                    align-items: center;
                    text-decoration: none; 
                 }

                 .footer{
                     position: absolute;
                     bottom: 0;
                     width: 100%;
                     text-align: center;
                     padding: 20px; 
                     background-color: rgba(0, 0, 0, 0.5); 
                     color: #fff9f9;
                 }

            
         </style>
        </head>  
        <body class = "background-page">
        <div id="navbar-placeholder"></div>
        <script src="nav.js"></script>
        <div class="hero-container">
            <h1><span style="font-weight: 700;">STEM</span>PACT</h1>
            <p>NON-PROFIT BIO-RESEARCH · INNOVATION · SUSTAINABLE DEVELOPMENT</p>
        </div>
        
        <div class="hero-buttons">
        <a href="vision.html" class="btn primary-btn">EXPLORE</a>
        <a href="https://instagram.com/5t3mclub" target="_blank" class="btn secondary-btn">INSTAGRAM</a>
    </div>
        <footer class="footer">
            &copy; 2026 STEMPACT (ADD MORE INFO LATER!!)
        </footer>
    </body>
    </html>
