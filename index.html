      padding: 0;
      box-sizing: border-box;

    body {

    /* NAVBAR */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      z-index: 10;
    }

    nav img {
      height: 70px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 40px;
    }

    nav ul li a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    nav ul li a:hover {
      color: #3acfcf;
    }

    /* HERO */
    .hero {
      height: 100vh;
      background-color: #0a2a3a;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 0 0 120px 100px;
      position: relative;
      overflow: hidden;

      margin: 0 0 10px 0;

      margin-bottom: 40px;
      position: relative;
    }

    .buttons {
